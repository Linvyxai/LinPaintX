[package]
name = "procraft-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "LinPaintX's painting engine: document model, brushes, stroke geometry and the canvas view (no GPU, no platform code)"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
miniz_oxide = { workspace = true }
# background removal (U2-Net): ONNX inference on the CPU, no C++ runtime; the transformers
# feature is for language models and is left out to keep the binary small
tract-onnx = { version = "0.23", default-features = false }
